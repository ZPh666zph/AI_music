 'capsize=3.0' in t),\n    ('参考线 #CBD5E1', '#CBD5E1' in t),\n    ('无 constrained_layout', 'constrained_layout' not in t),\n    ('底部图例 bbox -0.16', '-0.16' in t),\n    ('三格式导出', '[\\\"pdf\\\", \\\"svg\\\", \\\"png\\\"]' in t),\n    ('新目录 figures_ieee', 'figures_ieee' in t),\n]\nfor desc, ok in checks:\n    print(f'  {\\\"✓\\\" if ok else \\\"✗\\\"} {desc}')\nall_ok = all(ok for _, ok in checks)\nprint(f'\\n2. 规格落地检查: {\\\"全部通过\\\" if all_ok else \\\"存在缺失!\\\"}')\n\" 2>&1", "Bash=cd C:/Deepseek && python -c \"import librosa; print('librosa', librosa.__version__)\"", "Bash=cd C:/Deepseek && mkdir -p assets/audio && export PATH=\"/c/Users/16045/AppData/Local/Microsoft/WinGet/Packages/Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe/ffmpeg-8.1.2-full_build/bin:$PATH\" && for f in erhu dizi suona; do ffmpeg -y -i \"outputs/inference/demo_${f}.wav\" -codec:a libmp3lame -b:a 128k \"assets/audio/demo_${f}.mp3\" 2>/dev/null; done && ls -la assets/audio/", "Bash=cd C:/Deepseek && git init 2>&1 | head -1 && git add -A 2>&1 && echo \"=== 将提交的文件统计 ===\" && git status --short | wc -l && echo \"个文件\" && echo \"=== 体积检查 (确认大文件被排除) ===\" && git ls-files -s 2>/dev/null | awk '{print $4}' | while read f; do sz=$(stat -c%s \"$f\" 2>/dev/null || echo 0); if [ \"$sz\" -gt 1000000 ]; then echo \"⚠ 大文件: $f ($((sz/1024/1024))MB)\"; fi; done; echo \"检查完毕\"", "Bash=cd C:/Deepseek && echo \"=== 检查 >1MB 的暂存文件 ===\" && git diff --cached --name-only | while read f; do sz=$(stat -c%s \"$f\" 2>/dev/null || echo 0); if [ \"$sz\" -gt 1000000 ]; then echo \"⚠ $f ($((sz/1024))KB)\"; fi; done; echo \"检查完\" && echo \"=== figures 矢量图是否保留 ===\" && git diff --cached --name-only | grep \"figures.*pdf\" | wc -l && echo \"个 PDF 矢量图\"", "Bash=cd C:/Deepseek && git rm -r --cached fluidsynth 2>/dev/null; git rm --cached stage_summary.pdf 2>/dev/null; git add -A 2>/dev/null; echo \"=== 最终暂存文件数 ===\" && git diff --cached --name-only | wc -l && echo \"=== 剩余 >1MB 文件 ===\" && git diff --cached --name-only | while read f; do sz=$(stat -c%s \"$f\" 2>/dev/null || echo 0); if [ \"$sz\" -gt 1000000 ]; then echo \"$f ($((sz/1024))KB)\"; fi; done; echo \"检查完\"", "Bash=cd C:/Deepseek && git rm -r --cached . >/dev/null 2>&1; echo \"index 清空，当前暂存文件数: $(git diff --cached --name-only | wc -l)\"", "Bash=cd C:/Deepseek && git rm -r --cached . 2>&1 | head -5 && echo \"---\" && echo \"剩余暂存: $(git diff --cached --name-only | wc -l)\""]
